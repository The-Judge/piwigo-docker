name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
    tags:
      - '*'
  schedule:
    - cron: "15 3 * * *"

# https://stackoverflow.com/a/72408109/1549322
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set env for repo name
        run: echo "GITHUB_REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV
      - name: Set env for app-version
        run: echo "APP_VERSION=$(cat Dockerfile| grep 'ARG PIWIGO_VERSION' | cut -d '=' -f 2)" >> $GITHUB_ENV
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}
          tags: |
            type=sha,format=short,prefix=
      - name: Print Variables
        run: env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Replace PHP tag to latest (nightly)
        run: cat Dockerfile | sed 's#ARG PHP_VERSION=.*#ARG PHP_VERSION=latest#g' | sed 's#ARG PIWIGO_VERSION=.*#ARG PIWIGO_VERSION=latest#g' > Dockerfile
        if: github.event.schedule == '15 3 * * *'
      - name: Build and push Docker images (nightly)
        uses: docker/build-push-action@v6.7.0
        if: github.event.schedule == '15 3 * * *'
        with:
          pull: true
          push: true
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:nightly
      - name: Build and push Docker images (from master/main change)
        uses: docker/build-push-action@v6.7.0
        if: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && github.event.schedule != '15 3 * * *' }}
        with:
          pull: true
          push: true
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:latest,${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:${{ env.APP_VERSION }}
      - name: Build and push Docker images (from branch change)
        uses: docker/build-push-action@v6.7.0
        if: ${{ (github.ref_name != 'master' && github.ref_name != 'main') && github.event.schedule != '15 3 * * *' }}
        with:
          pull: true
          push: true
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/${{ env.GITHUB_REPO_NAME }}:${{ env.APP_VERSION }}
